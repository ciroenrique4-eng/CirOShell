[config]
reload_apps = true

[config.wallpaper]
command = "awww img --transition-type grow --transition-pos 0.5,0.5 --transition-duration 1 {{ image }}"
set = true

[templates.hyprland]
input_path  = "~/.config/hypr/scheme/matugen.conf.tpl"
output_path = "~/.config/hypr/scheme/current.conf"
post_hook   = "hyprctl reload"

[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty.conf.tpl"
output_path = "~/.config/kitty/colors.conf"
post_hook   = "pkill -SIGUSR1 kitty"

[templates.btop]
input_path  = "~/.config/matugen/templates/btop.theme.tpl"
output_path = "~/.config/btop/themes/matugen.theme"

[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk-colors.css.tpl"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk-colors.css.tpl"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.waybar]
input_path  = "~/.config/matugen/templates/waybar-colors.css.tpl"
output_path = "~/.config/waybar/colors.css"
post_hook   = "pkill -SIGUSR2 waybar"

[templates.tofi]
input_path  = "~/.config/matugen/templates/tofi.conf.tpl"
output_path = "~/.config/tofi/config"

[templates.tofi_apps]
input_path = "~/.config/matugen/templates/tofi_apps.conf.tpl"
output_path = "~/.config/tofi/apps"

[templates.qt6ct]
input_path  = "~/.config/matugen/templates/qt6ct-colors.conf.tpl"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.qt5ct]
input_path  = "~/.config/matugen/templates/qt6ct-colors.conf.tpl"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.swaync]
input_path  = "~/.config/matugen/templates/swaync.css.tpl"
output_path = "~/.config/swaync/style.css"
post_hook   = "swaync-client --reload-css"

[templates.vscode]
input_path  = "~/.config/matugen/templates/vscode.json.tpl"
output_path = "~/.config/Code/User/settings.json"

[templates.rofi]
input_path  = "~/.config/matugen/templates/dinamico.rasi.tpl"
output_path = "~/.config/rofi/colors/dinamico.rasi"

[templates.kdeglobals]
input_path  = "~/.config/matugen/templates/kdeglobals.tpl"
output_path = "~/.config/kdeglobals"
