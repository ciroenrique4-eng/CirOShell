# === Autenticación y keyring ===
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# === Portales XDG (necesario para screensharing, filepickers, etc.) ===
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/xdg-desktop-portal-hyprland &
exec-once = /usr/lib/xdg-desktop-portal &

# === Portapapeles ===
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# === Cursor ===
exec-once = hyprctl setcursor $cursorTheme $cursorSize
exec-once = gsettings set org.gnome.desktop.interface cursor-theme '$cursorTheme'
exec-once = gsettings set org.gnome.desktop.interface cursor-size $cursorSize

# === Luz de noche ===
exec-once = /usr/lib/geoclue-2.0/demos/agent
exec-once = sleep 1 && gammastep

# === MPRIS (controles bluetooth de media) ===
exec-once = mpris-proxy

# === Wallpaper con swww (Matugen lo llama para regenerar colores) ===
exec-once = awww-daemon
exec-once = awww img ~/.config/hypr/wallpaper.jpg

# === Waybar ===
exec-once = waybar

# === Notificaciones ===
exec-once = swaync

# === Limpieza de basura ===
exec-once = trash-empty 30

# === Matugen: regenerar paleta al iniciar ===
exec-once = matugen image ~/.config/hypr/wallpaper.jpg
