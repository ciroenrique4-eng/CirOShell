# === Temas Qt ===
# gtk3 reporta colorScheme=Dark (qt6ct siempre da Unknown y Darkly se pinta claro).
# QT_STYLE_OVERRIDE fuerza Darkly; la paleta oscura viene del tema GTK (matugen).
env = QT_QPA_PLATFORMTHEME, gtk3
env = QT_STYLE_OVERRIDE, Darkly
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = XCURSOR_THEME, $cursorTheme
env = XCURSOR_SIZE, $cursorSize

# === Backends de toolkit ===
env = GDK_BACKEND, wayland,x11
env = QT_QPA_PLATFORM, wayland;xcb
env = SDL_VIDEODRIVER, wayland,x11,windows
env = CLUTTER_BACKEND, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# === XDG ===
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# === Otros ===
env = _JAVA_AWT_WM_NONREPARENTING, 1

# === GPU (gestionado por scripts/󰢮 GPU Mode.sh) ===
source = ~/.config/hypr/hyprland/env_gpu.conf
