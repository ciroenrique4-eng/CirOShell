# === Apps ===
bind = $kbTerminal,     exec, kitty
bind = $kbBrowser,      exec, $browser
bind = $kbEditor,       exec, code
bind = $kbFileExplorer, exec, nautilus
bind = Super, G,        exec, github-desktop

bind = Super, O, exec, ~/.config/hypr/scripts/scripts.sh
bind = Super, N, exec, swaync-client -t -sw
bind = Ctrl+Alt, C, exec, swaync-client -C

# ============PANELES CON ROFI==========================
# === Selector de fondos de pantalla ===
bind = Super+Shift, W, exec, ~/.config/hypr/scripts/'󰸉 Fondos de Pantalla.sh'

# === Launcher (tofi) ===
bindr = SUPER, Super_L, exec, pgrep rofi && pkill rofi || rofi -show drun

# === Portapapeles ===
bind = Super, V,      exec, ~/.config/hypr/scripts/portapapeles.sh




# === Captura de pantalla ===
bind = , Print,          exec, grimblast copy screen
bind = Super+Shift, S,   exec, grimblast copy area
bind = Super+Shift+Alt, S, exec, grimblast save area

# === Selector de color ===
bind = Super+Shift, C, exec, hyprpicker -a

# === Volumen ===
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = Super+Shift, M,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ $volumeStep%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ $volumeStep%-

# === Media ===
bindl = Ctrl+Super, Space,  exec, playerctl play-pause
bindl = , XF86AudioPlay,    exec, playerctl play-pause
bindl = , XF86AudioPause,   exec, playerctl play-pause
bindl = , XF86AudioNext,    exec, playerctl next
bindl = Ctrl+Super, Equal,  exec, playerctl next
bindl = , XF86AudioPrev,    exec, playerctl previous
bindl = Ctrl+Super, Minus,  exec, playerctl previous
bindl = , XF86AudioStop,    exec, playerctl stop

# === Brillo ===
bindl = , XF86MonBrightnessUp,   exec, brightnessctl set 10%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# === Lock / Sleep ===
bind  = $kbLock,        exec, hyprlock
bindl = Super+Shift, L, exec, systemctl suspend-then-hibernate

# === Monitor del sistema ===
bind = $kbSysmon, exec, kitty -- btop

# === Ventanas: mover foco ===
bind = Super, left,  movefocus, l
bind = Super, right, movefocus, r
bind = Super, up,    movefocus, u
bind = Super, down,  movefocus, d

# === Ventanas: mover ===
bind = Super+Shift, left,  movewindow, l
bind = Super+Shift, right, movewindow, r
bind = Super+Shift, up,    movewindow, u
bind = Super+Shift, down,  movewindow, d

# === Ventanas: redimensionar ===
binde = Super+Alt, left,  resizeactive, -10% 0
binde = Super+Alt, right, resizeactive,  10% 0
binde = Super+Alt, up,    resizeactive,  0 -10%
binde = Super+Alt, down,  resizeactive,  0  10%

# === Ventanas: acciones ===
bindm = Super, mouse:272, movewindow
bindm = Super, mouse:273, resizewindow
bind  = Ctrl+Super, Backslash,     centerwindow, 1
bind  = $kbWindowFullscreen,       fullscreen, 0
bind  = $kbWindowBorderedFullscreen, fullscreen, 1
bind  = $kbToggleWindowFloating,   togglefloating
bind  = $kbCloseWindow,            killactive
bind  = $kbPinWindow,              pin

# === Grupos de ventanas ===
binde = $kbWindowGroupCycleNext, cyclenext
binde = $kbWindowGroupCyclePrev, cyclenext, prev
binde = Ctrl+Alt, Tab,         changegroupactive, f
binde = Ctrl+Shift+Alt, Tab,   changegroupactive, b
bind  = $kbToggleGroup,        togglegroup
bind  = $kbUngroup,            moveoutofgroup

# === Workspaces: ir a # ===
bind = $kbGoToWs, 1, workspace, 1
bind = $kbGoToWs, 2, workspace, 2
bind = $kbGoToWs, 3, workspace, 3
bind = $kbGoToWs, 4, workspace, 4
bind = $kbGoToWs, 5, workspace, 5
bind = $kbGoToWs, 6, workspace, 6
bind = $kbGoToWs, 7, workspace, 7
bind = $kbGoToWs, 8, workspace, 8
bind = $kbGoToWs, 9, workspace, 9
bind = $kbGoToWs, 0, workspace, 10

# === Workspaces: +1 / -1 ===
bind  = Super, mouse_down, workspace, -1
bind  = Super, mouse_up,   workspace, +1
binde = $kbPrevWs,         workspace, -1
binde = $kbNextWs,         workspace, +1

# === Workspaces: mover ventana a # ===
bind = $kbMoveWinToWs, 1, movetoworkspace, 1
bind = $kbMoveWinToWs, 2, movetoworkspace, 2
bind = $kbMoveWinToWs, 3, movetoworkspace, 3
bind = $kbMoveWinToWs, 4, movetoworkspace, 4
bind = $kbMoveWinToWs, 5, movetoworkspace, 5
bind = $kbMoveWinToWs, 6, movetoworkspace, 6
bind = $kbMoveWinToWs, 7, movetoworkspace, 7
bind = $kbMoveWinToWs, 8, movetoworkspace, 8
bind = $kbMoveWinToWs, 9, movetoworkspace, 9
bind = $kbMoveWinToWs, 0, movetoworkspace, 10

# === Workspaces: mover ventana +1 / -1 ===
binde = Super+Alt, Page_Up,   movetoworkspace, -1
binde = Super+Alt, Page_Down, movetoworkspace, +1
bind  = Super+Alt, mouse_down, movetoworkspace, -1
bind  = Super+Alt, mouse_up,   movetoworkspace, +1

# === Special workspace ===
bind = $kbToggleSpecialWs,       togglespecialworkspace, special
bind = Ctrl+Super+Shift, up,     movetoworkspace, special:special
bind = Ctrl+Super+Shift, down,   movetoworkspace, e+0

# === Cambiar wallpaper y regenerar colores con Matugen ===
bind = Super+Shift, W, exec, ~/.config/hypr/scripts/wallpaper.sh


# == Redimensionar ventanas ==
# Entrar en modo resize
bind = Super, X, submap, resize

submap = resize
binde = , right, resizeactive,  20 0
binde = , left,  resizeactive, -20 0
binde = , up,    resizeactive,  0 -20
binde = , down,  resizeactive,  0  20
bind  = , Escape, submap, reset
bind  = , Return, submap, reset
submap = reset
