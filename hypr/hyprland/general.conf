general {
    layout = dwindle
	resize_on_border = true
	extend_border_grab_area = 10  # área invisible extra alrededor del borde
	hover_icon_on_border = true   # cambia el cursor al pasar por el borde
    allow_tearing = true

    gaps_workspaces = $workspaceGaps
    gaps_in         = $windowGapsIn
    gaps_out        = $windowGapsOut
    border_size     = $windowBorderSize

    col.active_border   = $activeWindowBorderColour
    col.inactive_border = $inactiveWindowBorderColour
}

dwindle {
    preserve_split  = true
    smart_split     = false
    smart_resizing  = true
}
